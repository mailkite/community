title: "[Request] "
body:
  - type: markdown
    attributes:
      value: |
        Tell us the **problem** before the solution — the job you're trying to do and what's
        stopping you. We can often ship something better than the specific feature, and we
        can't if we only know the feature.

        Requests with a real use case behind them get built first.

  - type: dropdown
    id: area
    attributes:
      label: What area is this about?
      options:
        - Sending API
        - Inbound / webhooks
        - Shared inbox / dashboard
        - Inbox agents / auto-reply
        - MCP / agent tooling
        - An SDK or client library
        - A framework or platform integration
        - CLI
        - SMTP / IMAP
        - Deliverability
        - Billing / plans
        - Docs
        - Something else
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >-
        The actual job, in your words. What are you building, and where does MailKite get in
        the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: >-
        Your proposed shape, if you have one — an endpoint, a field, a dashboard control, an
        SDK method. Rough is fine.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How are you working around it now?
      description: >-
        What you're doing instead, and what that costs you. "Nothing — I'm blocked" is a
        useful answer too.

  - type: input
    id: language
    attributes:
      label: Language, framework, or platform
      description: Helps us know where it should land first.
      placeholder: Next.js on Vercel / Python

  - type: checkboxes
    id: checks
    attributes:
      label: Before posting
      options:
        - label: I searched existing discussions and this isn't already requested — if it is, I'll upvote that one instead.
          required: true
