title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Two things that get you an answer fastest: a **message ID or
        request ID**, and the smallest snippet that reproduces it.

        **Don't paste API keys, tokens, or real recipients' addresses** — this is a public
        thread. Redact them, or use [mailkite.dev/contact](https://mailkite.dev/contact) for
        anything account-specific.

  - type: dropdown
    id: surface
    attributes:
      label: Where did you hit this?
      options:
        - Sending (API / SDK)
        - Receiving (inbound route or webhook)
        - Shared inbox / dashboard
        - Inbox agents / auto-reply
        - MCP server or Claude Code plugin
        - CLI
        - SMTP relay
        - IMAP
        - Domain setup (MX / SPF / DKIM / DMARC)
        - Deliverability (mail landed in spam, or not at all)
        - Billing / quota
        - Docs
        - Something else
    validations:
      required: true

  - type: input
    id: library
    attributes:
      label: Library and version
      description: >-
        e.g. `mailkite@2.4.1` (npm), `mailkite-dev 1.3.0` (PyPI), `@mailkite/cli 0.9.2`.
        Write "REST" if you're calling the API directly, or "n/a" if this isn't code.
      placeholder: mailkite@2.4.1
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime and platform
      description: e.g. Node 22 on Cloudflare Workers, Python 3.12 on Lambda, PHP 8.3 on Forge.
      placeholder: Node 22 / Cloudflare Workers

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Include the full error and any status code. Redact keys and real addresses.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest snippet or sequence that shows the problem.
      render: shell

  - type: input
    id: ids
    attributes:
      label: Message ID or request ID
      description: >-
        From the API response, the delivery log, or the `x-mailkite-request-id` response
        header. This is the single most useful thing you can give us.
      placeholder: msg_01J8X…

  - type: input
    id: when
    attributes:
      label: When did it happen?
      description: Date and time with a timezone or UTC offset — we use it to find your request in the logs.
      placeholder: 2026-07-25 14:32 UTC

  - type: checkboxes
    id: checks
    attributes:
      label: Before posting
      options:
        - label: I searched existing discussions and this isn't already reported.
          required: true
        - label: I've removed API keys, tokens, and real recipients' addresses from everything above.
          required: true
